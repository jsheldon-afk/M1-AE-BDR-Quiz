<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ramp Quota Milestones — Seated M1 Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; All quizzes</a>
  <h1>Ramp Quota Milestones</h1>
  <p class="subtitle">Tap a number, then tap the month it belongs to. Only 4 of these 8 numbers are real milestones.</p>

  <div class="card name-field">
    <label for="rep-name">Your name</label>
    <input type="text" id="rep-name" placeholder="First and last name">
    <p id="name-error" style="display:none;color:var(--danger);font-size:13px;margin-top:6px;">Enter your name first.</p>
  </div>

  <div class="card">
    <div class="pool" id="pool"></div>
    <div id="slots"></div>
    <button class="primary" id="check-btn">Check answers</button>
    <p class="feedback" id="feedback"></p>
    <p class="score-note" id="score-note"></p>
  </div>
</div>

<script src="score.js"></script>
<script>
const pool = ["25%","30%","40%","50%","60%","75%","90%","100%"];
const months = ["October","November","December","January"];
const answers = {"October":"25%","November":"50%","December":"75%","January":"100%"};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let poolOrder = shuffle(pool);
let placed = {October:null, November:null, December:null, January:null};
let selected = null;

const poolEl = document.getElementById("pool");
const slotsEl = document.getElementById("slots");

function renderPool() {
  poolEl.innerHTML = "";
  poolOrder.forEach(val => {
    if (Object.values(placed).includes(val)) return;
    const btn = document.createElement("button");
    btn.className = "pool-tile" + (selected === val ? " selected" : "");
    btn.textContent = val;
    btn.addEventListener("click", () => {
      selected = (selected === val) ? null : val;
      renderPool();
    });
    poolEl.appendChild(btn);
  });
  if (poolEl.children.length === 0) {
    const p = document.createElement("p");
    p.style.cssText = "font-size:13px;color:var(--ink-secondary);margin:0;";
    p.textContent = "All numbers placed.";
    poolEl.appendChild(p);
  }
}

function renderSlots() {
  slotsEl.innerHTML = "";
  months.forEach(month => {
    const row = document.createElement("div");
    row.className = "slot-row";
    row.dataset.month = month;
    row.innerHTML =
      '<span class="slot-label" style="flex:1;">' + month + '</span>' +
      '<span class="slot-val">' + (placed[month] || "\u2014") + '</span>';
    row.addEventListener("click", () => {
      if (placed[month]) {
        selected = null;
        placed[month] = null;
      } else if (selected) {
        placed[month] = selected;
        selected = null;
      }
      renderPool();
      renderSlots();
    });
    slotsEl.appendChild(row);
  });
}

document.getElementById("check-btn").addEventListener("click", () => {
  const nameInput = document.getElementById("rep-name");
  const nameError = document.getElementById("name-error");
  const repName = requireName(nameInput, nameError);
  if (!repName) return;

  let correctCount = 0;
  months.forEach(month => {
    const row = slotsEl.querySelector('[data-month="' + month + '"] .slot-val');
    if (placed[month] === answers[month]) {
      row.className = "slot-val correct";
      correctCount++;
    } else {
      row.className = "slot-val incorrect";
    }
  });
  const fb = document.getElementById("feedback");
  if (correctCount === 4) {
    fb.className = "feedback success";
    fb.textContent = "All 4 milestones correct.";
  } else {
    fb.className = "feedback danger";
    fb.textContent = correctCount + " of 4 correct so far.";
  }

  submitScore("M1 AE/BDR Standalone Quizzes", "Ramp Quota Milestones", repName, correctCount, 4).then(res => {
    document.getElementById("score-note").textContent = res.recorded
      ? "Score recorded."
      : "Score not recorded yet — ask your manager if tracking isn't set up.";
  });
});

renderPool();
renderSlots();
</script>
</body>
</html>
