<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pre-Pitch Research — Seated Certification</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
  .section { margin-bottom: 40px; }
  .section h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 21px; letter-spacing: -0.005em; margin: 0 0 6px; }
  .section .desc { font-size: 13px; color: var(--ink-secondary); margin: 0 0 14px; }
  .quiz-q { margin-bottom: 18px; }
  .quiz-q p.prompt { font-weight: 600; font-size: 14.5px; margin: 0 0 10px; line-height: 1.45; }
  .quiz-opt {
    display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 6px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 13.5px; cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .quiz-opt.selected { border-color: var(--gold); border-width: 2px; background: var(--gold-tint); }
  .quiz-opt.correct { border-color: var(--success); background: var(--success-bg); color: var(--success); }
  .quiz-opt.incorrect { border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
  .quiz-explain { font-size: 12.5px; color: var(--ink-secondary); margin: 8px 0 0; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; All modules</a>
  <h1>Pre-Pitch Research</h1>
  <span class="month-badge">Month 2</span>
  <p class="subtitle">What to know before you ever get on the call.</p>

  <div class="card name-field">
    <label for="rep-name">Your name</label>
    <input type="text" id="rep-name" placeholder="First and last name">
    <label for="rep-email" style="margin-top:14px;">Your email</label>
    <input type="email" id="rep-email" placeholder="you@seatedapp.io">
    <p id="name-error" style="display:none;color:var(--danger);font-size:13px;margin-top:6px;">Enter your name and a valid email first.</p>
  </div>

  <div class="section card" id="quiz-section">
    <h2>Quiz</h2>
    <p class="desc">The specific facts worth having ready before a pitch call.</p>
    <div id="quiz-questions"></div>
    <button class="primary" id="quiz-submit">Submit module</button>
    <p class="feedback" id="quiz-feedback"></p>
    <p class="score-note" id="quiz-score-note"></p>
  </div>

</div>

<script src="score.js"></script>
<script>
const MODULE_NAME = "Pre-Pitch Research";
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function getRep() {
  const nameInput = document.getElementById("rep-name");
  const emailInput = document.getElementById("rep-email");
  const nameError = document.getElementById("name-error");
  return requireNameAndEmail(nameInput, emailInput, nameError);
}

(function() {
  const rawQuestions = [
    { prompt: "Before a pitch, what should you check about the restaurant's POS setup?", correct: "Whether they're in a hotel, a separate business, use prepay, or use Chowbus", wrong: ["Which specific POS brand they use for reporting", "Whether their POS supports Apple Pay", "How many terminals they have on-site"], explain: "These situations can cause MID tracking issues, so they're worth flagging before the call, not during it." },
    { prompt: "What two names should you confirm before the call?", correct: "The DM name(s) and the GM name", wrong: ["The head chef and the sommelier", "The marketing manager and the social media lead", "The owner's spouse and their accountant"], explain: "Knowing who you're speaking with, and who else is involved, before the call starts matters." },
    { prompt: "What two market-level facts should you know before the call?", correct: "The market name and its market launch date", wrong: ["The market's average rent prices", "The market's total restaurant count", "The market's most popular cuisine type"], explain: "Knowing when Seated launched in their market gives context for how established the program is there." },
    { prompt: "What performance metric should you check for the market?", correct: "GMV in the last 30 days", wrong: ["Total number of sign-ups all-time", "Average check size across the market", "Number of competitor restaurants nearby"], explain: "Recent GMV gives you a live read on how active the market actually is right now." },
    { prompt: "How many nearby restaurants already on Seated should you identify, and what should you note about them?", correct: "3 nearby restaurants, and their performance", wrong: ["1 nearby restaurant and its owner's name", "5 nearby restaurants and their menus", "10 nearby restaurants and their ratings"], explain: "Having 3 concrete, nearby examples with real performance data makes your pitch credible and specific." },
    { prompt: "What historical fact should you check about the prospect before the call?", correct: "Whether they've churned before, and when", wrong: ["Whether they've ever left a bad online review", "Whether they've worked with a competitor before", "Whether they've had a change in ownership"], explain: "If they've churned before, you need that context going in -- it changes the conversation." },
    { prompt: "What should you confirm about their ERB before the call?", correct: "Whether they have open tables today and later in the week, and when", wrong: ["Which ERB platform they currently subscribe to", "How much they pay for their ERB monthly", "Whether their ERB integrates with delivery apps"], explain: "Checking real-time table availability tells you how much inventory they actually have to work with." },
    { prompt: "What should you have decided before the call regarding pricing?", correct: "What take rates you're proposing", wrong: ["What discount you're authorized to offer", "What competitor's rate you'll reference", "What the maximum allowable rate is"], explain: "Walking in with a specific rate in mind, rather than figuring it out live, keeps the conversation moving." },
    { prompt: "What should you reflect on from the appointment-setting call before the pitch?", correct: "What you learned on that call", wrong: ["How long the call lasted", "Whether the call was recorded", "What time zone the prospect is in"], explain: "Anything you learned setting the appointment should carry directly into how you run the pitch." },
    { prompt: "What should you identify before the pitch regarding motivation to act now?", correct: "What urgency lever you're using", wrong: ["What discount you'll lead with", "What time of day works best for them", "What competitor they might mention"], explain: "Knowing your urgency lever ahead of time means you're not searching for one mid-conversation." },
    { prompt: "What should you prepare for in advance of the pitch?", correct: "An objection you anticipate they may have", wrong: ["A list of every possible objection with a rebuttal for each", "A backup pitch in case the first one fails", "A written script to read verbatim"], explain: "You don't need to prep every possible objection -- just think through the one you actually expect." },
    { prompt: "Broadly, what are the three things worth researching before any pitch?", correct: "The business, the deal terms, and your own mindset going in", wrong: ["The competitor landscape, the weather, and travel time", "The menu, the decor, and the wine list", "The restaurant's social media, reviews, and website design"], explain: "Everything above rolls up into knowing the business, knowing the deal, and walking in with the right mentality." }
  ];
  const questions = rawQuestions.map(q => {
    const options = shuffle([q.correct, ...q.wrong]);
    return { prompt: q.prompt, options: options, correct: options.indexOf(q.correct), explain: q.explain };
  });
  const answers = new Array(questions.length).fill(null);
  const container = document.getElementById("quiz-questions");

  questions.forEach((q, qi) => {
    const div = document.createElement("div");
    div.className = "quiz-q";
    div.innerHTML = '<p class="prompt">' + (qi + 1) + '. ' + q.prompt + '</p>';
    q.options.forEach((opt, oi) => {
      const btn = document.createElement("button");
      btn.className = "quiz-opt";
      btn.textContent = opt;
      btn.addEventListener("click", () => {
        answers[qi] = oi;
        [...div.querySelectorAll(".quiz-opt")].forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
      });
      div.appendChild(btn);
    });
    const explain = document.createElement("p");
    explain.className = "quiz-explain";
    explain.textContent = q.explain;
    div.appendChild(explain);
    container.appendChild(div);
  });

  document.getElementById("quiz-submit").addEventListener("click", () => {
    const rep = getRep();
    if (!rep) return;
    let correctCount = 0;
    const qDivs = container.querySelectorAll(".quiz-q");
    questions.forEach((q, qi) => {
      const optBtns = qDivs[qi].querySelectorAll(".quiz-opt");
      optBtns.forEach((b, oi) => {
        if (oi === q.correct) b.classList.add("correct");
        else if (oi === answers[qi]) b.classList.add("incorrect");
      });
      qDivs[qi].querySelector(".quiz-explain").style.display = "block";
      if (answers[qi] === q.correct) correctCount++;
    });
    document.getElementById("quiz-feedback").textContent = correctCount + " / " + questions.length + " correct.";
    submitScore(MODULE_NAME, "Full Module", rep.name, correctCount, questions.length, rep.email).then(res => {
      document.getElementById("quiz-score-note").textContent = res.recorded ? "Module score recorded." : "Score not recorded — check connection.";
    });
  });
})();
</script>
</body>
</html>
